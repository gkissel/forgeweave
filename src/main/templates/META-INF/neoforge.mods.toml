# This is the neoforge.mods.toml file. It contains the data relating to the loading mods.
# The overall format is standard TOML format, v0.5.0.
# Find more information on toml format here: https://github.com/toml-lang/toml

modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"
issueTrackerURL="https://github.com/gkissel/forgeweave/issues"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
description='''
Forgeweave brings modular tool building, material traits, modifiers, melting, alloying, and casting to modern Minecraft.
'''

# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# JEI integration (docs/SCOPE.md M1 issue #11) is optional: the mod works without it, it only adds
# recipe categories when JEI happens to be installed on the client.
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19,)"
    ordering="AFTER"
    side="CLIENT"

# Ponder integration (docs/SCOPE.md M2 issue #110) is optional too: without it, a one-time chat hint
# takes its place (ForgeweavePonderHint). See ForgeweavePonderPlugin's javadoc for the isolation this
# soft dependency needs.
[[dependencies.${mod_id}]]
    modId="ponder"
    type="optional"
    versionRange="[1,)"
    ordering="AFTER"
    side="CLIENT"
