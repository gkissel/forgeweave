# This is the neoforge.mods.toml file. It contains the data relating to the loading mods.
# The overall format is standard TOML format, v0.5.0.
# Find more information on toml format here: https://github.com/toml-lang/toml

modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"
issueTrackerURL="https://github.com/gkissel/forgeweave/issues"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
# T80 (parity audit): upstream's mcmod.info credits "boni, KnightMiner" as the Tinkers' Construct
# 2 authors -- not Forgeweave's, which is a new independent implementation (CLAUDE.md), so that
# roster does not carry over. No `logoFile` yet: there is no Forgeweave logo asset in the repo, and
# fabricating placeholder art (or deriving the upstream gear logo, which reads as impersonating the
# Tinkers' Construct brand rather than porting gameplay) is a maintainer/design decision this ticket
# does not default under the 1.12-parity rule -- left for a follow-up once real art exists.
authors="Gustavo Kissel"
displayURL="https://github.com/gkissel/forgeweave"
# Issue #601: one extra HumanoidModel.ArmPose constant, so the crossbow's cranking arms can be paced
# by the assembled crossbow's own drawTime instead of vanilla's fixed 25-tick charge duration. See
# dev.gkissel.forgeweave.client.CrossbowChargeArmPose for why that hook and no other.
enumExtensions="META-INF/enumextensions.json"
description='''
Forgeweave brings modular tool building, material traits, modifiers, melting, alloying, and casting to modern Minecraft.
'''

# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
# side="BOTH" here (both on neoforge and minecraft below) is the vanilla-server join policy itself,
# unchanged from the NeoForge MDK default -- and, on inspection, the deliberately correct one (T80):
# every dependency's `side` is what the network handshake reads to decide whether the remote peer
# must have this mod at all (NeoForge dropped 1.12's own opt-in `@NetworkCheckHandler` for this
# declarative form). Forgeweave adds real, persisted world content -- items, blocks, recipes, a
# smeltery, world generation -- so a client that has it cannot usefully join a vanilla server (its
# items have nothing to interact with server-side) and a vanilla client cannot usefully join a
# Forgeweave server (it cannot see the mod's blocks or hold its items). BOTH blocks both, which is
# correct for a full content mod. This is also a deliberate deviation from 1.12: TConstruct's own
# NetworkCheckHandler let a client carrying it connect to a vanilla server anyway (matchModVersions,
# side==SERVER branch) -- a permissive carry-over from when Tinkers' Construct 1 shipped no server
# content of its own. Forgeweave has never been that mod, so there is no equivalent case to port.
[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# JEI integration (docs/SCOPE.md M1 issue #11) is optional: the mod works without it, it only adds
# recipe categories when JEI happens to be installed on the client.
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19,)"
    ordering="AFTER"
    side="CLIENT"

# Ponder integration (docs/SCOPE.md M2 issue #110; issue #664 embeds it jar-in-jar together with its
# required client dependency Flywheel, so this entry is always satisfied on a normal install). Still
# declared optional rather than required: the code guards every Ponder touch behind ModList
# (ForgeweavePonderPlugin), so a repackaged install that strips the embedded jars degrades to the
# one-time chat hint (ForgeweavePonderHint) instead of refusing to load. Flywheel needs no entry of
# its own here -- the embedded Ponder jar declares that requirement itself.
[[dependencies.${mod_id}]]
    modId="ponder"
    type="optional"
    versionRange="[1,)"
    ordering="AFTER"
    side="CLIENT"

# DarkModeEverywhere compat (issue #335) is optional too: without it the mod works identically, it
# only sends the dme-shaderblacklist IMC entries (ForgeweaveDarkModeCompat) that exclude the
# meaning-carrying renderers from DME's darkening shader swap when DME happens to be installed.
[[dependencies.${mod_id}]]
    modId="darkmodeeverywhere"
    type="optional"
    versionRange="[1.21,1.22)"
    ordering="AFTER"
    side="CLIENT"

# Jade compat (issue #720) is optional: without it the mod is unchanged, it only adds the casting
# table/basin cooling percentage and the smeltery controller's shift-held fluid list to Jade's
# overlay when Jade happens to be installed. ForgeweaveJadePlugin is the code that guards every
# Jade touch -- discovered by Jade itself via classpath scanning for @WailaPlugin, so there is no
# ModList check to write here, just this declaration.
[[dependencies.${mod_id}]]
    modId="jade"
    type="optional"
    versionRange="[15,)"
    ordering="AFTER"
    side="CLIENT"

# WTHIT compat (issue #720), the same ticket's second overlay target: optional for the same reason
# as Jade above. ForgeweaveWthitPlugin is registered through
# src/main/resources/wthit_plugins.json rather than a scanned annotation, which is WTHIT's own
# plugin-discovery mechanism.
[[dependencies.${mod_id}]]
    modId="wthit"
    type="optional"
    versionRange="[12,)"
    ordering="AFTER"
    side="CLIENT"
