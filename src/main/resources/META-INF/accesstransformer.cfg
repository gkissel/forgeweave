# LivingEntity#lastHurt: the damage the current invulnerability window already absorbed, which vanilla
# compares every follow-up blow against. combat/SecondaryDamage restores it around a secondary hit --
# upstream 1.12 Modifier#attackEntitySecondary's `living.lastDamage += oldLastDamage` (issue #701).
public net.minecraft.world.entity.LivingEntity lastHurt

# LivingEntity#jumping: whether the entity is holding jump this tick. Truthful on the client for the
# local player, which is where compat/mekanism/modules/MekanismWornModules runs a jetpack module's
# thrust -- see that class's jetpackTick javadoc for why the motion lives on that side (issue #994).
public net.minecraft.world.entity.LivingEntity jumping
# 26.1.2: the client input's movement vector, which BowDrawMovement rescales while a bow is drawn.
public net.minecraft.client.player.ClientInput moveVector
# 26.1.2: GatedShapedRecipe wraps a built ShapedRecipe during datagen, where assemble() cannot run (no bound item components).
public net.minecraft.world.item.crafting.ShapedRecipe result
# 26.3: an item layer's quads are write-only (setQuads). client/ModifierOverlayModels reads back the
# nocked ammo's resolved quads from a capturing render state, as it did through prepareQuadList().
public net.minecraft.client.renderer.item.ItemStackRenderState$LayerRenderState quads
