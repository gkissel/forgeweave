plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // GameTest fixtures that must run in the dev/GameTest worlds but must never ship -- a synthetic
    // "modded" item in a c: tag and a melting recipe hotter than lava (docs/SCOPE.md M2 issue #96).
    // See src/gametest/resources/README.md; the jar task below drops them again.
    srcDir('src/gametest/resources')
}

repositories {
    // JUnit and its transitive dependencies for the unit test source set.
    mavenCentral()
    maven {
        // JEI (optional client-side integration -- see the compileOnly/localRuntime split below).
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    maven {
        // Ponder (docs/SCOPE.md M2 issue #110), a soft dependency -- see the compileOnly-only note
        // on the dependency itself below.
        name = 'CreateMod'
        url = 'https://maven.createmod.net'
    }
    maven {
        // Jade (issue #720, optional client-side integration -- same compileOnly/localRuntime split
        // as JEI below). Modrinth's own Maven proxy; Jade publishes no separate API-only artifact, so
        // both configurations below resolve the same coordinate.
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        // WTHIT's own API/mod artifacts (issue #720, optional client-side integration, group
        // mcp.mobius.waila -- compileOnly only, see the dependency's own comment below). WTHIT's
        // runtime dependency Bad Packets (group lol.bai, maven2.bai.lol) is not declared here: this
        // project only compiles against wthit-api and never runs WTHIT itself in dev (see that
        // dependency's comment for why), so badpackets is never actually needed.
        name = 'BadAsIntended'
        url = 'https://maven.bai.lol'
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Runs a real client that captures a PNG of every M1+ station screen to build/screenshots/
        // for pre-release review, then exits (docs/SCOPE.md issue #112; see scripts/screenshots.sh
        // and dev.gkissel.forgeweave.client.ScreenshotHarness). Not part of the CI/build gate.
        screenshotHarness {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'forgeweave.screenshot_harness', 'true'
            systemProperty 'forgeweave.screenshot_output_dir', file('build/screenshots').getAbsolutePath()
            // A fixed, deterministic window size, per the issue's requirement.
            programArguments.addAll '--width', '854', '--height', '480'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Runs `src/test/java` on a bootstrapped Minecraft, so codecs that need registries work in plain JUnit.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    // JEI (docs/SCOPE.md M1 issue #11): compileOnly so the mod compiles against JEI's API without
    // hard-requiring it (see neoforge.mods.toml's "optional" dependency entry), localRuntime so JEI
    // is present for our own dev-environment runs (client/server/gameTestServer) without becoming a
    // transitive dependency of anything depending on this mod.
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Jade (issue #720): the Jade/WTHIT overlay ticket. compileOnly so the mod compiles against
    // Jade's API without hard-requiring it (see neoforge.mods.toml's "optional" entry and
    // ForgeweaveJadePlugin's javadoc). NOT on localRuntime: that bucket extends runtimeClasspath
    // (see the configurations block above), which every run task's classpath is built from --
    // including runGameTestServer's. Jade's player-login handshake sends a client-only network
    // payload the GameTest fake player can't receive, crashing every gametest
    // (UnsupportedOperationException: Payload jade:server_ping_v1 may not be sent to the client!,
    // CI run 33640475384). ModDevGradle registers one additional-classpath configuration per run,
    // named "<run>AdditionalRuntimeClasspath" and *not* folded into runtimeClasspath, so
    // clientAdditionalRuntimeClasspath puts Jade on the client run only -- present for this
    // project's own client dev runs, absent from data/server/gameTestServer. Jade publishes one jar
    // (no separate API artifact) on Modrinth, so both configurations resolve the same coordinate.
    compileOnly "maven.modrinth:jade:${jade_version}"
    clientAdditionalRuntimeClasspath "maven.modrinth:jade:${jade_version}"

    // WTHIT (issue #720): the same overlay ticket's second target,
    // mcp.mobius.waila.api -- a different Java package from Jade's (renamed to snownee.jade.api
    // precisely so the two can coexist), registered separately via
    // src/main/resources/wthit_plugins.json rather than Jade's classpath-scanned @WailaPlugin. This
    // project runs Jade in its own client dev runs (the clientAdditionalRuntimeClasspath entry above) to exercise the
    // "overlay mod present" path in practice; WTHIT is deliberately compileOnly-only, not paired
    // with a localRuntime, because both overlays hook the same vanilla tooltip rendering and having
    // two active in one dev client mostly duplicates the same on-screen box; WTHIT would need the same
    // gametest-safe scoping if it were ever added at runtime anyway. ForgeweaveWthitPlugin's
    // own code path is exercised by installing WTHIT in a real client instead (same pattern as
    // Ponder's ModList-guarded compat, see the Ponder dependency's comment below).
    compileOnly "mcp.mobius.waila:wthit-api:neo-${wthit_version}"

    // Ponder (docs/SCOPE.md M2 issue #110): compileOnly only, deliberately no localRuntime pair like
    // JEI's above. The mod compiles against Ponder's scene-registration API without hard-requiring it
    // (see neoforge.mods.toml's "optional" entry and ForgeweavePonderPlugin's javadoc), but this
    // project's own dev/test runs (client/server/gameTestServer) never load it -- Ponder pulls in
    // Flywheel's rendering engine, which is unrelated risk to take on just to run this mod's own
    // GameTest suite, and scene playback is client-rendered content a headless GameTest can't observe
    // anyway. The "Ponder present" path is exercised by installing it in a real client, per the M2
    // release checklist ("Ponder present/absent both behave").
    // Ponder (issue #664, maintainer-approved additive feature): jar-in-jar embedded so players get
    // the smeltery scene without a separate install. `implementation` keeps it on every dev/test
    // runtime (runClient plays the scenes, runData extracts their lang through
    // ForgeweaveLanguageProvider, runGameTestServer proves both mods load headless on a dedicated
    // server); `jarJar` embeds it in the shipped jar. Flywheel is Ponder's own required client
    // dependency (see its neoforge.mods.toml) and arrives transitively for the runtime classpath via
    // Ponder's pom, but JarJar embeds only what is declared, so it gets its own jarJar line.
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    jarJar "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    jarJar "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Keep the GameTest-only datapack out of the published jar (see src/gametest/resources/README.md).
// One line per file there, so a new fixture that forgets to add its line is caught by review rather
// than by a wildcard quietly dropping something real.
tasks.named('jar', Jar) {
    exclude 'README.md'
    exclude 'data/c/tags/item/ingots/copper.json'
    exclude 'data/c/tags/item/ingots/bronze.json'
    exclude 'data/forgeweave/forgeweave/melting_recipe/gametest_above_lava.json'
    exclude 'data/forgeweave/forgeweave/smeltery_fuel/gametest_super_fuel.json'
    exclude 'data/forgeweave/forgeweave/material/gametest_conditional_absent.json'
    exclude 'data/forgeweave/forgeweave/material/gametest_conditional_present.json'
    exclude 'data/forgeweave/forgeweave/material/gametest_silver.json'
    exclude 'data/forgeweave/forgeweave/material/gametest_electrum.json'
    exclude 'data/forgeweave/forgeweave/melting_recipe/gametest_compat_smeltery_present.json'
    exclude 'data/forgeweave/forgeweave/casting_recipe/gametest_compat_smeltery_present.json'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
