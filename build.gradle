plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')
}

// COMPAT_DISABLED: partner mods with no Minecraft 26.1.2 NeoForge build anywhere (Modrinth,
// CurseForge or their own maven, checked 2026-10-26), so their API jars are not on the classpath
// and the files that name their types cannot compile. The files stay in the tree for when a build
// ships; each integration's entry point is still reached only inside its ModList guard, which on
// 26.1.2 logs that the integration is unavailable instead of registering anything. Datagen keeps
// emitting their recipe JSON, all of it behind `neoforge:conditions` on the partner's modid.
//   EMI (emi) -- the native plugin; JEI still covers recipe viewing.
//   Draconic Evolution (draconicevolution) -- fusion upgrades, module host, guardian crystals.
//   Create (create) -- the goggles helmet modifier.
//   Mekanism (mekanism) -- MekaTool/MekaSuit module container.
def compatDisabledMain = [
        'dev/gkissel/forgeweave/emi/**',
        'dev/gkissel/forgeweave/compat/draconic/FusionUpgradeRecipe.java',
        'dev/gkissel/forgeweave/compat/draconic/DraconicGuardianCrystals.java',
        'dev/gkissel/forgeweave/compat/draconic/modules/DraconicModuleEffects.java',
        'dev/gkissel/forgeweave/compat/draconic/modules/DraconicModuleHost.java',
        'dev/gkissel/forgeweave/compat/create/ForgeweaveCreateCompat.java',
        'dev/gkissel/forgeweave/compat/mekanism/modules/MekanismModuleContainer.java',
        'dev/gkissel/forgeweave/compat/mekanism/modules/MekanismModuleEffects.java',
        'dev/gkissel/forgeweave/compat/mekanism/modules/MekanismWornModules.java',
]
def compatDisabledTest = [
        'dev/gkissel/forgeweave/emi/**',
        'dev/gkissel/forgeweave/compat/draconic/FusionUpgradeRecipeTest.java',
        'dev/gkissel/forgeweave/compat/draconic/modules/DraconicModuleEffectsTest.java',
        'dev/gkissel/forgeweave/compat/draconic/modules/DraconicModuleHostTest.java',
        'dev/gkissel/forgeweave/compat/create/ForgeweaveCreateCompatTest.java',
        'dev/gkissel/forgeweave/compat/mekanism/MekanismModuleWiringTest.java',
        'dev/gkissel/forgeweave/compat/mekanism/modules/MekanismImcTest.java',
]
sourceSets.main.java { exclude compatDisabledMain }
sourceSets.test.java { exclude compatDisabledTest }

// GameTest fixtures that must run in the dev/GameTest worlds but must never ship -- a synthetic
// "modded" item in a c: tag and a melting recipe hotter than lava (docs/SCOPE.md M2 issue #96). A
// source set of its own, kept out of `sourceSets.main`, so it loads only in the `gameTestServer` run
// (see the `mods`/`runs` wiring in the neoForge block below) instead of every dev run and the
// published jar (issue #927). See src/gametest/resources/README.md.
sourceSets {
    // Convention already points its resources at src/gametest/resources -- nothing more to configure.
    gametest
}

// Issue #1066 gave the source set Java as well: the test addon that registers a tool and a part
// through `dev.gkissel.forgeweave.api.tool`, proving the public entry point works from outside the
// tables it feeds. It compiles against Minecraft, NeoForge and sourceSets.main, and rides the same
// gameTestServer-only mod binding its resources already do.
configurations {
    gametestImplementation.extendsFrom implementation
}

repositories {
    // JUnit and its transitive dependencies for the unit test source set.
    mavenCentral()
    maven {
        // JEI (optional client-side integration -- see the compileOnly/localRuntime split below).
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    maven {
        // EMI (issue #971, optional client-side integration -- see the compileOnly/test-classpath
        // split below). The maven EMI's own README names.
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases'
        content { includeGroup 'dev.emi' }
    }
    maven {
        // Ponder (docs/SCOPE.md M2 issue #110), a soft dependency -- see the compileOnly-only note
        // on the dependency itself below.
        name = 'CreateMod'
        url = 'https://maven.createmod.net'
    }
    maven {
        // KubeJS and its Rhino fork (issue #832, script-defined traits), a soft dependency -- see
        // the compileOnly/localRuntime split below.
        name = 'Latvian'
        url = 'https://maven.latvian.dev/releases'
    }
    maven {
        // Jade (issue #720, optional client-side integration -- same compileOnly/localRuntime split
        // as JEI below). Modrinth's own Maven proxy; Jade publishes no separate API-only artifact, so
        // both configurations below resolve the same coordinate.
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        // WTHIT's own API/mod artifacts (issue #720, optional client-side integration, group
        // mcp.mobius.waila -- compileOnly only, see the dependency's own comment below). WTHIT's
        // runtime dependency Bad Packets (group lol.bai, maven2.bai.lol) is not declared here: this
        // project only compiles against wthit-api and never runs WTHIT itself in dev (see that
        // dependency's comment for why), so badpackets is never actually needed.
        name = 'BadAsIntended'
        url = 'https://maven.bai.lol'
    }
    maven {
        // Draconic Evolution and its BrandonsCore library (issue #915, M8 deep compat), a soft
        // dependency -- see the compileOnly/test-classpath split on the dependencies below. This is
        // the maven both mods publish to and the one DE's own build.gradle names.
        name = 'Covers1624'
        url = 'https://maven.covers1624.net'
    }
    maven {
        // Apotheosis and its two required library mods, Placebo and Apothic Attributes (issue #969,
        // M8 deep compat), a soft dependency -- see the compileOnly/test-classpath split on the
        // dependencies below. This is the maven all three publish to and the one Apotheosis' own
        // build.gradle names.
        name = 'ShadowsOfFire'
        url = 'https://maven.shadowsoffire.dev/releases'
    }
    maven {
        // Occultism (issue #997, M8 deep compat, D-M8-18), a soft dependency -- see the
        // compileOnly/test-classpath split on the dependency below. The maven Occultism publishes to
        // and the one its own README names.
        name = 'KlikliDev'
        url = 'https://dl.cloudsmith.io/public/klikli-dev/mods/maven/'
        content { includeGroup 'com.klikli_dev' }
    }
    maven {
        // Mekanism (issue #993, M8 deep compat), a soft dependency -- see the compileOnly/
        // test-classpath split on the dependencies below. This is the maven Mekanism publishes to and
        // the one docs/SCOPE.md's D-M8-15 names.
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }
    maven {
        // Mystical Agriculture and its required Cucumber library, both by BlakeBr0 (issue #999,
        // M8 deep compat), a soft dependency -- see the compileOnly/test-classpath split on the
        // dependencies below. The maven D-M8-20 names, and the one both mods publish to.
        name = 'BlakesMods'
        url = 'https://maven.blakesmods.com/releases'
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Minecraft and NeoForge for the GameTest-only source set's Java (issue #1066); its half of the
    // classpath, sourceSets.main.output, is in the dependencies block below.
    addModdingDependenciesTo sourceSets.gametest

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }

        // A second binding for the same mod, folding in the GameTest-only "gametest" source set
        // above. Used only by the gameTestServer run's own `mods` override below, so
        // runClient/runServer/runData never see src/gametest/resources (issue #927) -- the run's
        // `mods` key is just a grouping label for the classpath roots FML unions into one virtual
        // mod file, not the modid itself (that still comes from neoforge.mods.toml inside
        // sourceSets.main), so this is safe to name however's clearest.
        "${mod_id}GameTest" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // loadedMods' convention is every mod registered above, which would otherwise pull in
            // "${mod_id}GameTest" too (issue #927) -- pin this run to the plain binding.
            loadedMods.set([mods."${mod_id}"])
        }

        // Runs a real client that captures a PNG of every M1+ station screen to build/screenshots/
        // for pre-release review, then exits (docs/SCOPE.md issue #112; see scripts/screenshots.sh
        // and dev.gkissel.forgeweave.client.ScreenshotHarness). Not part of the CI/build gate.
        screenshotHarness {
            client()
            // A game directory of its own, so the harness's options, Ponder settings and logs never
            // touch the run/ a developer plays in, and no jar dropped into run/mods loads here.
            gameDirectory = file('run/harness')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'forgeweave.screenshot_harness', 'true'
            systemProperty 'forgeweave.screenshot_output_dir', file('build/screenshots').getAbsolutePath()
            // Patterns for third-party log lines the harness's log scan may ignore (HarnessChecks).
            systemProperty 'forgeweave.harness_log_allowlist', file('scripts/harness-log-allowlist.txt').getAbsolutePath()
            // -PharnessNoJei: the "no JEI" variant (see the JEI dependency below). It only has to prove
            // the client boots and the world loads, so it stops once the world-join checks pass.
            if (project.hasProperty('harnessNoJei')) {
                systemProperty 'forgeweave.screenshot_harness_world_only', 'true'
            }
            // A fixed, deterministic window size, per the issue's requirement. Its aspect is what the
            // first-person poses are framed against; -PharnessWindow=1920x1080 keeps that aspect at a
            // full-screen size (scripts/screenshots-headless.sh passes it).
            def harnessWindow = (project.findProperty('harnessWindow') ?: '854x480').toString().split('x')
            programArguments.addAll '--width', harnessWindow[0], '--height', harnessWindow[1]
            // See the client run's comment above (issue #927).
            loadedMods.set([mods."${mod_id}"])
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // See the client run's comment above (issue #927).
            loadedMods.set([mods."${mod_id}"])
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Overrides the run's default mod binding (loadedMods' convention is every mod in the
            // block above) with just the one that includes the GameTest-only fixtures (issue #927).
            loadedMods.set([project.neoForge.mods.getByName("${mod_id}GameTest")])
        }

        data {
            // 26.1 splits datagen into client and server halves; clientData() runs both, which the
            // model, item-model and lang providers need.
            clientData()
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            // See the client run's comment above (issue #927).
            loadedMods.set([mods."${mod_id}"])
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    // Runs `src/test/java` on a bootstrapped Minecraft, so codecs that need registries work in plain JUnit.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
        // Its own loadedMods defaults to every mod registered above (like a run's), which since
        // issue #927 also includes "${mod_id}GameTest" -- the same modid "forgeweave", combined from
        // a different set of source sets. Loading both at once makes Bootstrap see one modid from two
        // candidate locations. Pin it to just the plain binding, matching testedMod.
        loadedMods.set([mods."${mod_id}"])
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    // The GameTest-only source set's Java compiles against the mod itself (issue #1066). Its test
    // addon deliberately imports nothing below dev.gkissel.forgeweave.api.tool except the GameTest
    // harness, which is the point: it is a stand-in for another mod's code.
    gametestImplementation sourceSets.main.output

    // JEI (docs/SCOPE.md M1 issue #11): compileOnly so the mod compiles against JEI's API without
    // hard-requiring it (see neoforge.mods.toml's "optional" dependency entry), localRuntime so JEI
    // is present for our own dev-environment runs (client/server/gameTestServer) without becoming a
    // transitive dependency of anything depending on this mod.
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    if (project.hasProperty('emiClient')) {
        // -PemiClient: the dev runs get EMI instead of JEI (see EMI's own comment just below).
        // localRuntime, not a <run>AdditionalRuntimeClasspath: that one lands on FML's legacy
        // classpath, where a jar is a plain library and is never discovered as a mod.
        // disabled on 26.1.2 (no partner build, see COMPAT_DISABLED below): localRuntime "dev.emi:emi-neoforge:${emi_version}"
    } else if (!project.hasProperty('harnessNoJei')) {
        // -PharnessNoJei drops JEI again, for the screenshot harness's "client boots without JEI" run.
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    }

    // EMI (issue #971): the native plugin in dev.gkissel.forgeweave.emi. compileOnly against EMI's own
    // API-only jar, plus the full jar on the unit-test classpath so ForgeweaveEmiPluginTest can run the
    // plugin's register() against a stub registry. Deliberately no localRuntime: EMI's server half sends
    // an emi:ping payload on every login (EmiNeoForge#playerConnect), the same "may not be sent to the
    // client" failure that keeps Jade off runGameTestServer below. It stays off the default client run
    // too, because EMI takes over JEI's overlay and recipe screen, and JeiScreenshotHarness needs JEI's
    // own. Building with -PemiClient swaps JEI out for EMI on every dev run, which is how the
    // EMI-without-JEI case gets looked at in a dev client (runClient, runScreenshotHarness). Don't
    // pass it to runGameTestServer, for the emi:ping reason above.
    // disabled on 26.1.2 (no partner build, see COMPAT_DISABLED below): compileOnly("dev.emi:emi-neoforge:${emi_version}:api") { transitive = false }
    // disabled on 26.1.2 (no partner build, see COMPAT_DISABLED below): testCompileOnly("dev.emi:emi-neoforge:${emi_version}:api") { transitive = false }
    // disabled on 26.1.2 (no partner build, see COMPAT_DISABLED below): testRuntimeOnly("dev.emi:emi-neoforge:${emi_version}") { transitive = false }
    // JeiRecipesScaleTest's category-list pin builds every category against a recording fake
    // registration. Tests compile against the API jar but run on the full mod jar, which bundles the
    // same API classes: the API jar has no mods.toml, so FML leaves it on the app class loader, where
    // its Minecraft references fail with a LinkageError. The full jar loads as a mod, like KubeJS below.
    testCompileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    testRuntimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }

    // Jade (issue #720): the Jade/WTHIT overlay ticket. compileOnly so the mod compiles against
    // Jade's API without hard-requiring it (see neoforge.mods.toml's "optional" entry and
    // ForgeweaveJadePlugin's javadoc). NOT on localRuntime: that bucket extends runtimeClasspath
    // (see the configurations block above), which every run task's classpath is built from --
    // including runGameTestServer's. Jade's player-login handshake sends a client-only network
    // payload the GameTest fake player can't receive, crashing every gametest
    // (UnsupportedOperationException: Payload jade:server_ping_v1 may not be sent to the client!,
    // CI run 33640475384). ModDevGradle registers one additional-classpath configuration per run,
    // named "<run>AdditionalRuntimeClasspath" and *not* folded into runtimeClasspath, so
    // clientAdditionalRuntimeClasspath puts Jade on the client run only -- present for this
    // project's own client dev runs, absent from data/server/gameTestServer. Jade publishes one jar
    // (no separate API artifact) on Modrinth, so both configurations resolve the same coordinate.
    compileOnly "maven.modrinth:jade:${jade_version}"
    // 26.1.2: MDG dropped the per-run additional classpath (everything is on the module path now),
    // so there is no way left to put Jade on the client run alone. It is compileOnly only; the
    // "Jade present" path is exercised by the compat matrix and a real client install instead.
    // clientAdditionalRuntimeClasspath "maven.modrinth:jade:${jade_version}"

    // WTHIT (issue #720): the same overlay ticket's second target,
    // mcp.mobius.waila.api -- a different Java package from Jade's (renamed to snownee.jade.api
    // precisely so the two can coexist), registered separately via
    // src/main/resources/wthit_plugins.json rather than Jade's classpath-scanned @WailaPlugin. This
    // project runs Jade in its own client dev runs (the clientAdditionalRuntimeClasspath entry above) to exercise the
    // "overlay mod present" path in practice; WTHIT is deliberately compileOnly-only, not paired
    // with a localRuntime, because both overlays hook the same vanilla tooltip rendering and having
    // two active in one dev client mostly duplicates the same on-screen box; WTHIT would need the same
    // gametest-safe scoping if it were ever added at runtime anyway. ForgeweaveWthitPlugin's
    // own code path is exercised by installing WTHIT in a real client instead (same pattern as
    // Ponder's ModList-guarded compat, see the Ponder dependency's comment below).
    compileOnly "mcp.mobius.waila:wthit-api:neo-${wthit_version}"

    // Ponder (docs/SCOPE.md M2 issue #110): compileOnly only, deliberately no localRuntime pair like
    // JEI's above. The mod compiles against Ponder's scene-registration API without hard-requiring it
    // (see neoforge.mods.toml's "optional" entry and ForgeweavePonderPlugin's javadoc), but this
    // project's own dev/test runs (client/server/gameTestServer) never load it -- Ponder pulls in
    // Flywheel's rendering engine, which is unrelated risk to take on just to run this mod's own
    // GameTest suite, and scene playback is client-rendered content a headless GameTest can't observe
    // anyway. The "Ponder present" path is exercised by installing it in a real client, per the M2
    // release checklist ("Ponder present/absent both behave").
    // Ponder (issue #664, maintainer-approved additive feature): jar-in-jar embedded so players get
    // the smeltery scene without a separate install. `implementation` keeps it on every dev/test
    // runtime (runClient plays the scenes, runData extracts their lang through
    // ForgeweaveLanguageProvider, runGameTestServer proves both mods load headless on a dedicated
    // server); `jarJar` embeds it in the shipped jar. Flywheel is Ponder's own required client
    // dependency (see its neoforge.mods.toml) and arrives transitively for the runtime classpath via
    // Ponder's pom, but JarJar embeds only what is declared, so it gets its own jarJar line.
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    jarJar "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    jarJar "dev.engine-room.flywheel:flywheel-neoforge:${flywheel_version}"
    // On 26.1 Ponder split its Catnip utility library into a mod of its own, a compile-scope
    // dependency in Ponder's pom, so it is embedded alongside Ponder too.
    jarJar "net.createmod.catnip:catnip-neoforge:${ponder_version}+mc${minecraft_version}"

    // KubeJS (issue #832, ADR-0004 item 3): compileOnly like JEI above -- the mod compiles against
    // KubeJS's plugin/event API without hard-requiring it (an "optional" entry in
    // neoforge.mods.toml; the one class touching the API, kubejs.ForgeweaveKubeJSPlugin, is only
    // ever instantiated by KubeJS itself via kubejs.plugins.txt). Deliberately NO localRuntime pair,
    // the Ponder reasoning: with KubeJS loaded in runGameTestServer its own kubejs:sync_server_data
    // payload is refused for the GameTest mock players ("may not be sent to the client") and ~40
    // unrelated tests fail, so the "KubeJS present" path is exercised by ForgeweaveKubeJSPluginTest
    // (the test pair below puts the same two jars on the unit-test classpath, where KubeJS loads
    // cleanly) and by installing it in a real client. Rhino is KubeJS's script engine and its only
    // compile-scope dependency; its pom excludes everything else and the remaining runtime pieces
    // are jar-in-jar embedded in the KubeJS jar, hence transitive = false rather than chasing them
    // through a third maven.
    compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    compileOnly "dev.latvian.mods:rhino:${rhino_version}"
    testCompileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    testCompileOnly "dev.latvian.mods:rhino:${rhino_version}"
    testRuntimeOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") { transitive = false }
    testRuntimeOnly "dev.latvian.mods:rhino:${rhino_version}"

    // Issue #915 (M8 deep compat): Draconic Evolution's fusion crafting. compileOnly plus the test
    // classpath, and deliberately no localRuntime -- the same call Jade and KubeJS made above, for
    // the same reason: dropping a full third-party content mod into the dev/gametest runtime makes
    // the gametest server negotiate that mod's own registry and login payloads, a failure surface
    // this repo's CI has no business owning. Everything the compat layer touches is guarded by
    // ModList (dev.gkissel.forgeweave.compat.draconic.ForgeweaveDraconicCompat) and by the
    // `neoforge:conditions` on its generated recipe JSON, so a Forgeweave-only runtime never
    // classloads a com.brandon3055 type at all -- which is what runGameTestServer proves.
    //
    // BrandonsCore is a row of its own because neither published pom declares a single dependency:
    // nothing here is transitive, and DE's fusion API signatures reference `TechLevel`, which lives
    // in BrandonsCore rather than in DE. CodeChicken Lib is DE's third runtime dependency, but
    // nothing on the fusion API's compile surface reaches it (only DE's own datagen recipe builder
    // does, and this repo emits that JSON directly), so it is not listed.
    // disabled on 26.1.2 (no partner build, see COMPAT_DISABLED below): compileOnly "com.brandon3055.draconicevolution:Draconic-Evolution:${draconic_evolution_version}"
    // disabled on 26.1.2 (no partner build, see COMPAT_DISABLED below): compileOnly "com.brandon3055.brandonscore:BrandonsCore:${brandons_core_version}"
    // disabled on 26.1.2 (no partner build, see COMPAT_DISABLED below): testCompileOnly "com.brandon3055.draconicevolution:Draconic-Evolution:${draconic_evolution_version}"
    // disabled on 26.1.2 (no partner build, see COMPAT_DISABLED below): testCompileOnly "com.brandon3055.brandonscore:BrandonsCore:${brandons_core_version}"
    // disabled on 26.1.2 (no partner build, see COMPAT_DISABLED below): testRuntimeOnly("com.brandon3055.draconicevolution:Draconic-Evolution:${draconic_evolution_version}") { transitive = false }
    // disabled on 26.1.2 (no partner build, see COMPAT_DISABLED below): testRuntimeOnly("com.brandon3055.brandonscore:BrandonsCore:${brandons_core_version}") { transitive = false }
    // disabled on 26.1.2 (no partner build, see COMPAT_DISABLED below): testRuntimeOnly("io.codechicken:CodeChickenLib:${codechicken_lib_version}") { transitive = false }

    // Issue #969 (M8 deep compat): Apotheosis' gem sockets. Same compileOnly-plus-test-classpath
    // split as Draconic Evolution above, and deliberately no localRuntime for the same reason --
    // a full third-party content mod in the gametest runtime is a failure surface this repo's CI
    // has no business owning. Everything that names a dev.shadowsoffire type lives in
    // dev.gkissel.forgeweave.compat.apotheosis and is reached only from inside a ModList guard
    // (ApotheosisSockets), and the application recipes carry `neoforge:conditions` on `apotheosis`,
    // so a Forgeweave-only runtime never classloads one -- which is what runGameTestServer proves.
    //
    // Placebo and Apothic Attributes get rows of their own because both are on the gem API's own
    // compile surface, not just Apotheosis' runtime: GemItem.getGem returns Placebo's
    // DynamicHolder, and SocketedGems.addModifiers takes Apothic Attributes'
    // StackAttributeModifiersEvent (the only way to read what a gem's attribute bonus actually
    // grants -- AttributeBonus keeps its own attribute field protected). transitive = false on the
    // runtime rows, the Draconic pattern: nothing else is needed to put the classes on a classpath.
    compileOnly "dev.shadowsoffire:Apotheosis:${apotheosis_version}"
    compileOnly "dev.shadowsoffire:Placebo:${placebo_version}"
    compileOnly "dev.shadowsoffire:ApothicAttributes:${apothic_attributes_version}"
    testCompileOnly "dev.shadowsoffire:Apotheosis:${apotheosis_version}"
    testCompileOnly "dev.shadowsoffire:Placebo:${placebo_version}"
    testCompileOnly "dev.shadowsoffire:ApothicAttributes:${apothic_attributes_version}"
    testRuntimeOnly("dev.shadowsoffire:Apotheosis:${apotheosis_version}") { transitive = false }
    testRuntimeOnly("dev.shadowsoffire:Placebo:${placebo_version}") { transitive = false }
    testRuntimeOnly("dev.shadowsoffire:ApothicAttributes:${apothic_attributes_version}") { transitive = false }
    // Issue #1007 (M8 deep compat): Create's own Engineer's Goggles, read through
    // GogglesItem.addIsWearingPredicate. compileOnly only, no test-classpath pair and no localRuntime --
    // ForgeweaveCreateCompat's own unit coverage stays off Create entirely by testing the ItemStack-only
    // half of the seam (see its javadoc), the same "test the bridge, not the mod" call KubeJS's comment
    // above explains for its own gametest-hostile payloads. Everything that touches Create is guarded by
    // ModList (dev.gkissel.forgeweave.compat.create.ForgeweaveCreateCompat) and by the
    // `neoforge:conditions` on modifier_recipe/goggles.json, so a Forgeweave-only runtime never
    // classloads a com.simibubi.create type at all. The "slim" classifier is Create's own compile-only
    // API jar; its POM lists every dependency at Maven `runtime` scope, so none of it lands on this
    // compileOnly classpath.
    // disabled on 26.1.2 (no partner build, see COMPAT_DISABLED below): compileOnly "com.simibubi.create:create-1.21.1:${create_version}:slim"

    // Issue #997 (M8 deep compat, D-M8-18): Occultism's spirit binding ritual. Same
    // compileOnly-plus-test-classpath split as Draconic Evolution and Apotheosis above, and
    // deliberately no localRuntime for the same reason. Everything that names a com.klikli_dev type
    // lives in dev.gkissel.forgeweave.compat.occultism.SpiritBindingRitual and is reached only from
    // inside a ModList guard (ForgeweaveOccultismCompat), and every crushing, miner and ritual row
    // carries `neoforge:conditions` on `occultism`, so a Forgeweave-only runtime never classloads
    // one -- which is what runGameTestServer proves. transitive = false on every row: Occultism's
    // POM declares GeckoLib, SmartBrainLib, Modonomicon and a curse.maven Jade at runtime scope,
    // and the last of those needs a cursemaven repository this build deliberately does not add.
    // Occultism itself consumes other mods' APIs exactly this way.
    //
    // No testRuntimeOnly pair, which is the one place this deviates from Draconic Evolution's and
    // Apotheosis' rows, and issue #997 asked for one. It does not work: FML loads every mod on the
    // unit-test classpath, and Occultism refuses to load without Modonomicon, GeckoLib, SmartBrainLib
    // and Curios, each on a maven of its own. Adding all four to make one test class run is the
    // "failure surface this repo's CI has no business owning" that Create's comment above declines,
    // and it would put four content mods in every unit-test run rather than one. Instead the whole of
    // what the ritual decides lives in ForgeweaveOccultismCompat#bind, the Occultism-free half, where
    // both a plain unit test (OccultismRitualTest) and a GameTest (OccultismGameTests) can execute it
    // for real -- more coverage than a loadable jar would have bought, not less.
    compileOnly("com.klikli_dev:occultism-${minecraft_version}-neoforge:${occultism_version}") { transitive = false }
    testCompileOnly("com.klikli_dev:occultism-${minecraft_version}-neoforge:${occultism_version}") { transitive = false }
    // Issue #993 (M8 deep compat, D-M8-15): Mekanism's module container, so Forgeweave gear made of
    // atomic_matter_alloy takes MekaTool and MekaSuit modules. Same compileOnly plus test-classpath
    // split Draconic Evolution and Apotheosis use above, and for the same reason: nothing here is on
    // any run classpath, so dev, gametest and the published jar never classload a mekanism type, and
    // the compat package's unit tests are the only place the bridge actually executes.
    //
    // Deliberately no localRuntime: the gametest server would then load Mekanism, and every GameTest
    // that walks the item roster would start answering for a world Forgeweave does not ship.
    //
    // The plain jar rather than the `api` classifier -- see gradle.properties' comment for the three
    // mekanism.common entry points #993 names. transitive = false on the test-runtime row because
    // Mekanism's pom lists its own library set, none of which the bridge touches.
    // disabled on 26.1.2 (no partner build, see COMPAT_DISABLED below): compileOnly "mekanism:Mekanism:${mekanism_version}"
    // disabled on 26.1.2 (no partner build, see COMPAT_DISABLED below): testCompileOnly "mekanism:Mekanism:${mekanism_version}"
    // disabled on 26.1.2 (no partner build, see COMPAT_DISABLED below): testRuntimeOnly("mekanism:Mekanism:${mekanism_version}") { transitive = false }
    // Issue #999 (D-M8-20): Mystical Agriculture's crop registry and its tinkering API. The same
    // compileOnly-plus-test-classpath split Draconic Evolution and Apotheosis use above, and
    // deliberately no localRuntime for the same reason -- a full third-party content mod in the
    // gametest runtime is a failure surface this repo's CI has no business owning. Everything that
    // names a com.blakebr0 type lives in dev.gkissel.forgeweave.compat.mysticalagriculture and is
    // reached only through Mystical Agriculture's own plugin scan, so a Forgeweave-only runtime never
    // classloads one -- which is what runGameTestServer proves, and what
    // MysticalAgricultureSourceIsolationTest keeps true.
    //
    // The "api" classifier is Mystical Agriculture's own API-only jar. Cucumber is a row of its own
    // because the published pom declares no dependencies at all, so nothing arrives transitively. It
    // is not on Forgeweave's own compile surface -- the crop API's LazyIngredient turned out to be
    // Mystical Agriculture's own com.blakebr0.mysticalagriculture.api.lib type, not Cucumber's -- and
    // it is declared anyway because Mystical Agriculture hard-requires it at runtime
    // (cucumber [8.0.16,) in its own neoforge.mods.toml), so a classpath holding one without the
    // other is not a configuration any player will ever have. transitive = false on the runtime rows,
    // the Draconic pattern: nothing else is needed to put the classes on a classpath.
    compileOnly "com.blakebr0.mysticalagriculture:MysticalAgriculture:${mystical_agriculture_version}"
    compileOnly "com.blakebr0.cucumber:Cucumber:${cucumber_version}"
    testCompileOnly "com.blakebr0.mysticalagriculture:MysticalAgriculture:${mystical_agriculture_version}"
    testCompileOnly "com.blakebr0.cucumber:Cucumber:${cucumber_version}"
    testRuntimeOnly("com.blakebr0.mysticalagriculture:MysticalAgriculture:${mystical_agriculture_version}") { transitive = false }
    testRuntimeOnly("com.blakebr0.cucumber:Cucumber:${cucumber_version}") { transitive = false }

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// No jar exclude list needed for the GameTest-only datapack (see src/gametest/resources/README.md):
// it lives in its own `gametest` source set now (issue #927), never part of `sourceSets.main`, so
// the `jar` task -- which only packages sourceSets.main.output -- never sees it in the first place.
// GametestFixturesNotInMainResourcesTest guards against this coming back.

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
