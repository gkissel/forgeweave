# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.21.1]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=21.1.248
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)
# JEI (optional, client-side only -- build.gradle's compileOnly/localRuntime split, mods.toml's
# optional dependency entry). https://maven.blamejared.com/mezz/jei/jei-1.21.1-neoforge-api/
jei_version=19.43.0.393
# Ponder (docs/SCOPE.md M2 issue #110 wired the seam; issue #664 ships scenes): jar-in-jar embedded
# plus implementation for the dev/test runtime -- see build.gradle's comment on the dependency
# block. https://maven.createmod.net
ponder_version=1.0.87
# Flywheel is Ponder's own required client-side dependency (its neoforge.mods.toml pins [1.0.0,2.0);
# its pom pins this exact version), embedded alongside it for the same reason.
flywheel_version=1.0.4
# KubeJS (issue #832, script-defined traits): optional, compileOnly/localRuntime like JEI. The 2101.x
# line is the 1.21.1 build; Rhino is KubeJS's own script-engine fork, pinned to the version its pom
# names. https://maven.latvian.dev/releases/dev/latvian/mods/kubejs-neoforge/
kubejs_version=2101.7.2-build.374
rhino_version=2101.2.7-build.81
# Jade (issue #720, optional, client-side only -- build.gradle's compileOnly/localRuntime split,
# mods.toml's optional dependency entry). https://modrinth.com/mod/jade/version/15.9.4+neoforge
jade_version=15.9.4+neoforge
# WTHIT (issue #720, optional, client-side only -- build.gradle's compileOnly-only split, mods.toml's
# optional dependency entry). https://modrinth.com/mod/wthit/version/neo-12.7.0
wthit_version=12.7.0

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=forgeweave
# The human-readable display name for the mod.
mod_name=Forgeweave
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=MIT
# The mod version. See https://semver.org/. Overridden per-build with -Pmod_version=<version> (see docs/releasing.md).
mod_version=0.0.0-dev
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=dev.gkissel.forgeweave
