name: Feature request
description: Propose a Forgeweave gameplay or compatibility improvement
title: "[Feature]: "
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: Explain the player problem first, then the proposed solution and its tradeoffs.
  - type: textarea
    id: problem
    attributes:
      label: Player problem
      description: What limitation or missing experience does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain acquisition, interactions, balance, and compatibility where relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches could solve the same problem?
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched for an existing request covering this idea.
          required: true
        - label: This request is for Forgeweave, not the official Tinkers' Construct project.
          required: true
