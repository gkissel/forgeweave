name: Release

on:
  push:
    tags:
      - "mc*-v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^mc([0-9]+\.[0-9]+(\.[0-9]+)?)-v(.+)$ ]]; then
            minecraft_version="${BASH_REMATCH[1]}"
            mod_version="${BASH_REMATCH[3]}"
          else
            echo "Expected a tag such as mc1.21.1-v0.1.0" >&2
            exit 1
          fi

          case "${mod_version}" in
            *alpha*) release_type="alpha" ;;
            *beta*|*rc*) release_type="beta" ;;
            *) release_type="release" ;;
          esac

          echo "minecraft_version=${minecraft_version}" >> "${GITHUB_OUTPUT}"
          echo "mod_version=${mod_version}" >> "${GITHUB_OUTPUT}"
          echo "release_type=${release_type}" >> "${GITHUB_OUTPUT}"

      - name: Validate publishing configuration
        id: publish-config
        shell: bash
        env:
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          present=0
          for value in "${MODRINTH_PROJECT_ID}" "${CURSEFORGE_PROJECT_ID}" "${MODRINTH_TOKEN}" "${CURSEFORGE_TOKEN}"; do
            test -n "${value}" && present=$((present + 1))
          done

          if [[ "${present}" -eq 4 ]]; then
            echo "Modrinth and CurseForge are fully configured; publishing to both." >&2
            echo "publish_external=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${present}" -eq 0 ]]; then
            echo "Modrinth and CurseForge are not configured; publishing to GitHub only." >&2
            echo "publish_external=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Partial Modrinth/CurseForge configuration: set MODRINTH_PROJECT_ID, CURSEFORGE_PROJECT_ID, MODRINTH_TOKEN, and CURSEFORGE_TOKEN together, or leave all four unset." >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build
        run: ./gradlew build -Pmod_version=${{ steps.release.outputs.mod_version }}

      - name: Publish everywhere
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3
        with:
          files: build/libs/!(*-@(dev|sources|javadoc)).jar

          name: Forgeweave ${{ steps.release.outputs.mod_version }} for Minecraft ${{ steps.release.outputs.minecraft_version }}
          version: ${{ github.ref_name }}
          version-type: ${{ steps.release.outputs.release_type }}

          loaders: neoforge
          game-versions: ${{ steps.release.outputs.minecraft_version }}
          java: Java 21

          # Explicit list because mc-publish otherwise mirrors neoforge.mods.toml, which would tell
          # players to install Ponder -- it (and its own required client dependency Flywheel) is
          # jar-in-jar embedded since issue #664, so the store pages mark both as embedded instead.
          dependencies: |
            jei(optional)
            darkmodeeverywhere(optional)
            ponder(embedded)
            flywheel(embedded)

          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.ref_name }}
          github-draft: false
          github-prerelease: ${{ steps.release.outputs.release_type != 'release' }}
          github-generate-changelog: true

          retry-attempts: 2
          fail-mode: fail
