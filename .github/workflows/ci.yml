name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build
        run: ./gradlew build

      - name: Check datagen output is current
        # ADR-0002: models, recipes, and lang are generated by NeoForge datagen and the output is
        # committed. Re-run the generator and fail if it produced anything different from what's
        # committed (modified or untracked) under src/generated/resources.
        run: |
          ./gradlew runData
          if [ -n "$(git status --porcelain -- src/generated/resources)" ]; then
            echo "::error::src/generated/resources is stale; run './gradlew runData' and commit the result."
            git status --porcelain -- src/generated/resources
            git diff -- src/generated/resources
            exit 1
          fi

  gametest:
    name: GameTest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run GameTest suite
        # Headless by design (type = "gameTestServer" in build.gradle); no display server needed.
        # ModDevGradle's runGameTestServer task fails the Gradle process (nonzero exit) when any
        # required GameTest fails, so this step fails the job on a GameTest regression.
        run: ./gradlew runGameTestServer
